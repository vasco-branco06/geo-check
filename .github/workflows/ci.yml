name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
        # One Windows entry rather than the whole matrix again. The risk here is
        # a path separator or a line ending, which is a property of the platform
        # and not of the interpreter version, and .gitattributes marks the
        # fixtures byte exact precisely because of it.
        include:
          - os: windows-latest
            python-version: "3.12"
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev]"

      - name: Lint
        run: |
          ruff check src tests scripts
          ruff format --check src tests scripts

      # The suite is offline and replays recorded responses, including the
      # golden set of thirty hard sites. It never touches the network, so CI
      # cannot be flaky because someone else's robots.txt changed.
      - name: Test
        run: pytest -q --cov=geo_check --cov-report=term-missing:skip-covered

  generated:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev]"

      # docs/CRAWLERS.md and assets/output.svg say they are generated from
      # something else. The suite checks their shape; only these check them byte
      # for byte, which is what catches a hand edit that keeps the shape and
      # changes the meaning. Three files drifted that way before this existed.
      - name: The generated files are current
        run: |
          python scripts/build_crawlers_doc.py --check
          python scripts/build_output_image.py --check

  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      # Proves the console script, the packaged agent list and the argument
      # parser all survive a real install. Deliberately does not audit a live
      # site: the suite's whole claim is that it never touches the network, and
      # a CI job that does would be flaky for reasons no contributor caused.
      - name: Build the wheel and install it clean
        run: |
          python -m pip install --upgrade pip build
          python -m build --wheel
          python -m venv /tmp/clean
          /tmp/clean/bin/python -m pip install dist/*.whl
          /tmp/clean/bin/geo-check --help
          /tmp/clean/bin/python -c "from geo_check.robots import load_agents; assert len(load_agents()) > 20"
