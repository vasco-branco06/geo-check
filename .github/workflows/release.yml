name: release

# Publishes to PyPI without a token existing anywhere. GitHub proves who it is
# over OIDC, PyPI trusts that proof, and there is nothing to leak from a laptop
# or a repository secret. The trusted publisher is configured once at
# pypi.org/manage/account/publishing and names this file by its filename, so
# renaming this workflow breaks publishing until that entry is updated too.

on:
  push:
    # v0.3.0 yes, v0 no. The major tag moves forward with every release, and a
    # second attempt to publish a version PyPI already has fails by design.
    tags: ["v*.*.*"]
  # The tag for a release that is already cut cannot fire a workflow that did
  # not exist when it was pushed, so the first publish is a manual one.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      # What lets the job prove its identity to PyPI. Without it there is no
      # token and no proof, and nothing publishes.
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      # A version on PyPI can never be replaced or corrected, only hidden. The
      # easiest way to make that permanent mistake is to tag v0.4.0 while
      # pyproject.toml still says 0.3.0, so refuse rather than publish it.
      - name: Refuse to publish if the tag and the version disagree
        run: |
          version=$(python -c "import tomllib,pathlib; print(tomllib.loads(pathlib.Path('pyproject.toml').read_text())['project']['version'])")
          echo "pyproject.toml says $version"
          case "$GITHUB_REF" in
            refs/tags/*)
              tag="${GITHUB_REF#refs/tags/v}"
              echo "the tag says $tag"
              if [ "$tag" != "$version" ]; then
                echo "::error::tag v$tag does not match version $version. Nothing published."
                exit 1
              fi
              ;;
            *)
              echo "::warning::not running from a tag, so the version was not checked against one"
              ;;
          esac

      # Built from what the tag holds rather than from whatever is in a local
      # dist/ directory. twine check catches metadata that PyPI would reject
      # after the upload has already started.
      - name: Build and check the distributions
        run: |
          python -m pip install --upgrade pip build twine
          python -m build
          python -m twine check dist/*
          ls -la dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@v1.14.2

  # v0 is what README.md hands people and what the Marketplace serves, and until
  # now only a person moved it. Once nobody did: it sat 7 commits behind, serving
  # a USER_AGENT carrying the old account name, which was exactly what the newer
  # commit existed to remove. The comment at the top of this file has always said
  # the major tag moves forward with every release. Now it does.
  major-tag:
    needs: publish
    # Its own job because permissions are per job and there is no step level
    # scope. A step at the end of publish would leave contents: write live during
    # an unpinned pip install and a third party upload action. A job also shows
    # as run or skipped in the run graph, where a step's if does not.
    permissions:
      contents: write
    # A dispatch runs from a branch, where GITHUB_REF_NAME is a branch name, and
    # a branch called v0.5-prep strips to v0 exactly as a tag does. Without this
    # the Marketplace would be pointed at an unreleased commit.
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # No checkout. The API takes a SHA, so there is no clone and no question
      # about what a shallow fetch would let git push. This is the command that
      # has been run by hand after every release, which is the only version known
      # to work against this repository.
      - name: Point the major tag at this release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          major="${GITHUB_REF_NAME%%.*}"   # v0.4.0 -> v0, v1.0.0 -> v1
          # PATCH cannot create, and the first v1.0.0 derives a v1 that has never
          # existed. The POST is that one release.
          gh api -X PATCH "repos/$GITHUB_REPOSITORY/git/refs/tags/$major" \
            -f sha="$GITHUB_SHA" -F force=true ||
            gh api -X POST "repos/$GITHUB_REPOSITORY/git/refs" \
              -f ref="refs/tags/$major" -f sha="$GITHUB_SHA"
          echo "$major now points at $GITHUB_SHA"
